<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>직원 근태·연차</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F6;--panel:#fff;--ink:#17242E;--mute:#5F7080;--line:#D8E0E6;--acc:#0E6E6E;--warn:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0F171D;--panel:#17222A;--ink:#E7EEF2;--mute:#93A5B3;--line:#2B3A45;--acc:#4FC3C3;--warn:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:20px 14px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}small,.hint{color:var(--mute);font-size:13px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
section>label>input{width:100%}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.big{font-size:28px;font-weight:700;margin:0;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-weight:500;color:var(--mute)}
.r{text-align:right}.msg{color:var(--warn);font-size:13px;min-height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .hd{font-size:12px;color:var(--mute);text-align:center}
.c{min-height:64px;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:12px;cursor:pointer;background:var(--panel);overflow:hidden}
.c b{font-weight:500}.c small{display:block;color:var(--warn);font-size:10px;line-height:1.1}.c.sun b{color:var(--warn)}.c.full{outline:2px solid var(--warn)}
.c i,.lg i{display:block;font-style:normal;font-size:10.5px;line-height:1.35;color:#fff;border-radius:3px;padding:0 3px;margin-top:2px;overflow:hidden;white-space:nowrap}
.c.sel{outline:3px solid var(--acc);outline-offset:-2px}.cal.dg{touch-action:none;user-select:none;-webkit-user-select:none}.c.cl{background:var(--bg)}.c i.lv{background:transparent;border:1px dashed}.c i.me{outline:2px solid var(--ink)}.lg{display:flex;flex-wrap:wrap;gap:6px}.lg i{display:inline-block;padding:1px 8px;font-size:12px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}.w{color:var(--warn)}nav{display:flex;flex-wrap:wrap;gap:6px}a.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--ink);background:var(--panel);margin:3px 0}select{max-width:100%}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
// ▼ Supabase 프로젝트의 URL과 Publishable key(sb_publishable_...)를 붙여넣으세요.
// 위치: 프로젝트 화면 위쪽 Connect 버튼, 또는 Settings > API Keys. secret key·service_role key는 절대 넣지 마세요.
const SUPABASE_URL='https://uwgqtnsmhrawrgcjiuzk.supabase.co', SUPABASE_KEY='sb_publishable_qkCKbdR9lPUOncUscEHLrw_zwXLRD06';

const $=s=>document.querySelector(s), app=$('#app');
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('sv-SE'), today=()=>iso(new Date()), nowT=()=>new Date().toTimeString().slice(0,5);
const yr=new Date().getFullYear(), ST={pending:'승인 대기',approved:'승인',rejected:'반려'};
const hrs=l=>{if(!l.start_time||!l.end_time)return 0;const t=x=>{const[a,b]=x.split(':');return +a+ +b/60};let d=t(l.end_time)-t(l.start_time);if(d<0)d+=24;return Math.max(d-(l.break_min||0)/60,0)};
const wk=d=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const HRS={0:['09:00','18:00'],1:['10:00','20:00'],2:['10:00','20:00'],3:['10:00','20:00'],5:['10:00','20:00'],6:['09:00','18:00']};
const hh=(p,d)=>{const h=HRS[new Date(d+'T00:00:00').getDay()]||HRS[1];return (p.start_time?String(p.start_time).slice(0,5):h[0])+'–'+(p.end_time?String(p.end_time).slice(0,5):h[1])};
const tmn=x=>+x.slice(0,2)+ +x.slice(3,5)/60;
const wh=p=>[...new Set((p.work_days||'').split(''))].reduce((a,c)=>{const k=DAY.indexOf(c);if(k<0||k===4)return a;const h=HRS[k];return a+Math.max(tmn(p.end_time?String(p.end_time):h[1])-tmn(p.start_time?String(p.start_time):h[0])-1,0)},0);
let dg={on:false,u:'',k:'off'},me=null,tab='me',cal={y:new Date().getFullYear(),m:new Date().getMonth()},cd={};
const DAY='일월화수목금토',PAL=['#0E6E6E','#3A46C8','#B35C00','#8A3FA0','#2E7D32','#C2185B','#00796B','#6D4C41'];
const HOL={'2026-01-01':'신정','2026-02-16':'설연휴','2026-02-17':'설날','2026-02-18':'설연휴','2026-03-01':'삼일절','2026-03-02':'대체','2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-24':'석가탄신','2026-05-25':'대체','2026-06-03':'선거일','2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체','2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴','2026-10-03':'개천절','2026-10-05':'대체','2026-10-09':'한글날','2026-12-25':'성탄절'};

async function render(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session) return authView();
  const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  me=data; if(!me){app.innerHTML='<p>프로필을 불러오지 못했습니다. 다시 로그인해 주세요.</p>';return}
  tab==='cal'?calView():tab==='pay'?payView():tab==='info'?infoView():tab==='slip'?slipView():me.role==='owner'?ownerView():staffView();
}
function hdr(){return `<nav><button data-a="tab" data-id="me"${tab==='me'?' class="on"':''}>내 정보</button> <button data-a="tab" data-id="cal"${tab==='cal'?' class="on"':''}>근무표</button> <button data-a="tab" data-id="pay"${tab==='pay'?' class="on"':''}>추가수당</button> <button data-a="tab" data-id="info"${tab==='info'?' class="on"':''}>개인정보</button> <button data-a="tab" data-id="slip"${tab==='slip'?' class="on"':''}>급여명세서</button></nav><header style="margin-top:12px"><h1>${esc(me.name||'이름 없음')} <small>${me.role==='owner'?'사장':'직원'}</small></h1><button data-a="lo">로그아웃</button></header>`}
function authView(){
  app.innerHTML=`<section><h2>직원 근태·연차</h2><label>이메일<input id="em" type="email" autocomplete="username"></label><label>비밀번호 (6자 이상)<input id="pw" type="password" autocomplete="current-password"></label><label>이름 (가입할 때만)<input id="nm"></label><p><button class="pri" id="li">로그인</button> <button id="su">가입</button></p><p class="msg" id="m"></p></section>`;
  const m=t=>$('#m').textContent=t;
  $('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?m('로그인 실패: '+error.message):render()};
  $('#su').onclick=async()=>{const{data,error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value,options:{data:{name:$('#nm').value}}});error?m(error.message):data.session?render():m('가입되었습니다. 로그인해 주세요.')};
}

async function staffView(){
  const[L,W]=await Promise.all([sb.from('leave_requests').select('*').eq('user_id',me.id).order('leave_date',{ascending:false}),sb.from('work_logs').select('*').eq('user_id',me.id).order('work_date',{ascending:false}).limit(60)]);
  const lv=L.data||[],logs=W.data||[],inY=l=>l.leave_date.startsWith(String(yr));
  const used=lv.filter(l=>l.status==='approved'&&inY(l)).length,pend=lv.filter(l=>l.status==='pending'&&inY(l)).length,ali=lv.filter(l=>l.status==='approved'&&l.kind==='맞춤'&&inY(l)).length;
  const open=logs.find(l=>l.work_date===today()),ws={};
  logs.forEach(l=>{const k=wk(l.work_date);ws[k]=(ws[k]||0)+hrs(l)});
  app.innerHTML=hdr()+`<section><h2>남은 연차</h2><p class="big">${me.leave_total-used}일 <small>/ 총 ${me.leave_total}일</small></p><p class="hint">사용 ${used}일(사장 일정 맞춤 ${ali}일 포함)${pend?` · 승인 대기 ${pend}일`:''}</p></section>
<section><h2>근무시간</h2>${open&&!open.end_time?`<p>출근 ${open.start_time.slice(0,5)} · 휴게(분) <input id="br" type="number" value="60" style="width:80px"> <button class="pri" data-a="out" data-id="${open.id}">퇴근</button></p>`:open?`<p>오늘 ${hrs(open).toFixed(1)}시간 근무했습니다.</p>`:`<p><button class="pri" data-a="in">출근</button></p>`}
<table><tr><th>주(월요일 시작)</th><th class="r">근무시간</th></tr>${Object.keys(ws).sort().reverse().slice(0,6).map(k=>`<tr><td>${k}</td><td class="r">${ws[k].toFixed(1)}h</td></tr>`).join('')||'<tr><td colspan="2">기록이 없습니다.</td></tr>'}</table></section>
<section><h2>연차 신청</h2><input id="ld" type="date" min="${today()}"> <button class="pri" data-a="rq">신청</button><p class="msg" id="m"></p>
<table>${lv.slice(0,15).map(l=>`<tr><td>${l.leave_date}</td><td>${esc(l.kind)}</td><td>${ST[l.status]}</td><td class="r">${l.status==='pending'?`<button data-a="cx" data-id="${l.id}">취소</button>`:''}</td></tr>`).join('')||'<tr><td>신청 내역이 없습니다.</td></tr>'}</table></section>`;
}

async function ownerView(){
  const[P,L]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('leave_requests').select('*').gte('leave_date',yr+'-01-01').order('leave_date')]);
  const st=(P.data||[]).filter(p=>p.role==='staff'),lv=L.data||[],nm=Object.fromEntries((P.data||[]).map(p=>[p.id,p.name||'이름 없음']));
  const pend=lv.filter(l=>l.status==='pending');
  app.innerHTML=hdr()+`<section><h2>승인 대기 ${pend.length}건</h2><table>${pend.map(l=>`<tr><td>${esc(nm[l.user_id])}</td><td>${l.leave_date}</td><td class="r"><button class="pri" data-a="ap" data-id="${l.id}">승인</button> <button data-a="rj" data-id="${l.id}">반려</button></td></tr>`).join('')||'<tr><td>대기 중인 신청이 없습니다.</td></tr>'}</table></section>
<section><h2>직원 연차 (${yr}년)</h2><table><tr><th>이름</th><th>남은</th><th>맞춤</th><th class="r">총 연차(일)</th></tr>${st.map(p=>{const u=lv.filter(l=>l.user_id===p.id&&l.status==='approved');return `<tr><td>${esc(p.name||'이름 없음')}</td><td>${p.leave_total-u.length}일</td><td>${u.filter(l=>l.kind==='맞춤').length}일</td><td class="r"><input type="number" step="0.5" value="${p.leave_total}" style="width:64px" id="t${p.id}"> <button data-a="sv" data-id="${p.id}">저장</button></td></tr>`}).join('')||'<tr><td>가입한 직원이 없습니다.</td></tr>'}</table></section>
<section><h2>사장 일정 맞춤 휴무 (전 직원, 연차 1일 차감)</h2><input id="al" type="date"> <button class="pri" data-a="al">지정</button><p class="msg" id="m"></p></section>
<section><h2>급여 계산기용 내보내기</h2><input id="mo" type="month" value="${today().slice(0,7)}"> <button class="pri" data-a="ex2">근무표 기준 CSV</button> <button data-a="ex">출퇴근 기록 기준 CSV</button><p class="hint">월급제는 근무표 기준을 권장합니다. 근무표에서 실제 근무하는 날의 시간만 담고, 연차·맞춤 휴무는 휴가로 표시해 초과 근무 계산에서 빠집니다. 공휴일·목요일은 담지 않습니다. 급여 계산기에 그대로 올리세요.</p></section>`;
}

async function calView(){
  const p2=n=>String(n).padStart(2,'0'),s=cal.y+'-'+p2(cal.m+1)+'-01',e=iso(new Date(cal.y,cal.m+1,1));
  const[P,L,O]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('leave_requests').select('user_id,leave_date,kind').eq('status','approved').gte('leave_date',s).lt('leave_date',e),sb.from('schedule_overrides').select('*').gte('work_date',s).lt('work_date',e).order('work_date')]);
  const st=(P.data||[]).filter(p=>p.role==='staff'),col=Object.fromEntries(st.map((p,i)=>[p.id,PAL[i%PAL.length]])),nm=Object.fromEntries(st.map(p=>[p.id,p.name||'이름 없음']));
  const lv=new Set((L.data||[]).map(l=>l.user_id+l.leave_date)),ov=Object.fromEntries((O.data||[]).map(o=>[o.user_id+o.work_date,o]));
  const stat=(p,d)=>{const o=ov[p.id+d];if(o)return o.kind==='work'?'work':'off';if(lv.has(p.id+d))return 'leave';if(HOL[d])return 'hol';if(new Date(d+'T00:00:00').getDay()===4)return 'off';return (p.work_days||'').includes(DAY[new Date(d+'T00:00:00').getDay()])?'work':'off'};
  const nd=new Date(cal.y,cal.m+1,0).getDate(),lead=(new Date(cal.y,cal.m,1).getDay()+6)%7;
  let cells='<div></div>'.repeat(lead),open=0,full=0;cd={};
  for(let i=1;i<=nd;i++){
    const d=cal.y+'-'+p2(cal.m+1)+'-'+p2(i),w=new Date(d+'T00:00:00').getDay();
    const rows=st.map(p=>({p,t:stat(p,d),o:ov[p.id+d]})),wk_=rows.filter(x=>x.t==='work'),lv_=rows.filter(x=>x.t==='leave');
    cd[d]=[...wk_,...lv_];if(wk_.length)open++;if(wk_.length>=5)full++;
    const chips=wk_.map(x=>`<i style="background:${col[x.p.id]}"${x.p.id===me.id?' class="me"':''}>${esc((x.p.name||'?').slice(0,3))}</i>`).join('')+lv_.map(x=>`<i class="lv" style="color:${col[x.p.id]}">${esc((x.p.name||'?').slice(0,3))}</i>`).join('');
    cells+=`<div class="c${wk_.length>=5?' full':''}${w===0||HOL[d]?' sun':''}${w===4||HOL[d]?' cl':''}" data-a="day" data-d="${d}"><b>${i}</b>${HOL[d]?`<small>${HOL[d]}</small>`:w===4?'<small>휴진</small>':''}<div>${chips}</div></div>`;
  }
  if(!st.some(p=>p.id===dg.u))dg.u=st[0]?st[0].id:'';
  const dn=p=>(p.name||'이름 없음')+(st.filter(x=>x.name===p.name).length>1?' #'+p.id.slice(0,4):'');
  const drag=me.role==='owner'&&st.length?`<section><h2>드래그로 근무·휴무 바꾸기</h2><p><select id="gu">${st.map(p=>`<option value="${p.id}"${p.id===dg.u?' selected':''}>${esc(dn(p))}</option>`).join('')}</select> <select id="gk"><option value="off"${dg.k==='off'?' selected':''}>휴무로 만들기</option><option value="work"${dg.k==='work'?' selected':''}>근무로 만들기</option><option value="reset"${dg.k==='reset'?' selected':''}>원래대로 되돌리기</option></select></p><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="gon" type="checkbox" style="width:auto"${dg.on?' checked':''}> 드래그 켜기</label><p class="hint">직원과 동작을 고르고 '드래그 켜기'를 체크하세요. 달력에서 날짜를 누른 채 끌면 지나간 날짜가 모두 선택되고, 손을 떼면 한 번에 적용됩니다. 작업이 끝나면 체크를 끄세요(끄면 날짜를 눌러 근무자를 볼 수 있습니다).</p></section>`:'';
  const own=me.role==='owner'?`<section><h2>근무 설정</h2><table><tr><th>이름</th><th>요일</th><th>시간</th><th></th></tr>${st.map(p=>`<tr><td>${esc(p.name)}<br><small class="${wh(p)>40?'w':''}">주 ${wh(p).toFixed(0)}시간</small></td><td><input id="w${p.id}" value="${esc(p.work_days)}" style="width:84px"></td><td><input id="s${p.id}" type="time" value="${p.start_time?p.start_time.slice(0,5):''}"> <input id="e${p.id}" type="time" value="${p.end_time?p.end_time.slice(0,5):''}"></td><td><button data-a="ws" data-id="${p.id}">저장</button></td></tr>`).join('')||'<tr><td>가입한 직원이 없습니다.</td></tr>'}</table><p class="hint">요일은 근무하는 요일을 글자로 적습니다. 예: 월수금토일. 목요일은 진료를 쉬므로 자동으로 제외됩니다. 시간을 비우면 진료시간(월·화·수·금 10–20시, 토·일 9–18시, 점심 1시간 제외)이 적용되고, 주 근무시간이 40시간을 넘으면 빨갛게 표시됩니다.</p></section>
<section><h2>예외 근무·휴무</h2><select id="ou">${st.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select> <input id="odt" type="date"> <select id="ok"><option value="work">근무</option><option value="off">휴무</option></select> <input id="on" placeholder="메모 (예: 대체공휴일)" style="width:150px"> <button class="pri" data-a="ov">저장</button><p class="msg" id="m"></p><table>${(O.data||[]).map(o=>`<tr><td>${o.work_date}</td><td>${esc(nm[o.user_id]||'')}</td><td>${o.kind==='work'?'근무':'휴무'}${o.note?' · '+esc(o.note):''}</td><td><button data-a="od" data-id="${o.id}">삭제</button></td></tr>`).join('')}</table></section>`:'';
  app.innerHTML=hdr()+drag+`<section><p style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px"><button data-a="mv" data-id="-1">◀</button><b>${cal.y}년 ${cal.m+1}월</b><button data-a="mv" data-id="1">▶</button></p>

  });
  const head=hourly?'<th>주(월요일)</th><th class="r">근무</th><th class="r">기본</th><th class="r">가산</th><th class="r">주휴</th>':'<th>주(월요일)</th><th class="r">근무</th><th class="r">초과</th><th class="r">추가수당</th>';
  const own=me.role==='owner'?`<section><h2>급여 설정 — ${esc(p.name)}</h2><label>급여 방식<select id="pt"><option value="salary"${hourly?'':' selected'}>월급제</option><option value="hourly"${hourly?' selected':''}>시급제(시간제)</option></select></label><label>월급(원, 월급제)<input id="ms" type="number" value="${ps&&ps.monthly_salary!=null?ps.monthly_salary:''}"></label><label>시급(원, 시급제)<input id="hr" type="number" value="${ps&&ps.hourly_rate!=null?ps.hourly_rate:''}"></label><label>주 소정근로시간<input id="mw" type="number" step="0.5" value="${wk}"></label><label>주 40시간 초과 배율<input id="mm" type="number" step="0.1" value="${mult}"></label><label>대체공휴일 근무 추가(원래 근무 요일, 배)<input id="ma" type="number" step="0.1" value="${sa}"></label><label>대체공휴일 근무 총 배율(오프 요일)<input id="mt" type="number" step="0.1" value="${so_}"></label><p><button class="pri" data-a="ps" data-id="${p.id}">저장</button></p><p class="msg" id="m"></p></section>`:'';
  app.innerHTML=hdr()+`<section><h2>추가수당 내역 <small>${me.role==='owner'?'사장님과 해당 직원만 볼 수 있습니다':'나와 사장님만 볼 수 있습니다'}</small></h2>
${me.role==='owner'?`<p><select id="pu">${st.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${esc(x.name||'이름 없음')}</option>`).join('')}</select></p>`:''}
<p style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px"><button data-a="mv" data-id="-1">◀</button><b>${cal.y}년 ${cal.m+1}월</b><button data-a="mv" data-id="1">▶</button></p>
${has?(hourly?`<p class="hint">시급 <b>${won(rate)}</b> (시간제)</p>`:`<p class="hint">통상시급 = 월급 ${won(sal)} ÷ 월 소정근로시간 ${mh}시간 = <b>${won(rate)}</b></p>`)+`<p class="big">${won(tot)}</p><p class="hint">${hourly?'이번 달 기본급+가산+주휴 합계 (연차 수당 제외)':'이번 달 추가수당 합계'}</p>`:'<p class="hint">급여 설정이 아직 없어 금액은 표시되지 않습니다. 시간 계산만 보여드립니다.</p>'}
<table><tr>${head}</tr>${rows||'<tr><td colspan="5">이 달에 근무표상 근무가 없습니다.</td></tr>'}</table>
<p class="hint">근무표 기준이며 연차·공휴일·맞춤 휴무 시간은 근무시간에서 제외합니다. 월 경계에 걸친 주는 해당 월의 날짜만 계산합니다.</p></section>`+own;
}

app.onclick=async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a,id=b.dataset.id,m=t=>{const x=$('#m');if(x)x.textContent=t};
  if(a==='lo'){privKey=null;showAll=false;await sb.auth.signOut();return render()}
  if(a==='tab'){tab=id;showAll=false;return render()}
  if(a==='mv'){cal.m+=+id;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}return render()}
  if(a==='day'){if(dg.on)return;const d=b.dataset.d,tm=x=>String(x||'').slice(0,5);$('#dd').innerHTML='<b>'+d+(HOL[d]?' · '+HOL[d]:'')+'</b><br>'+((cd[d]||[]).map(x=>esc(x.p.name)+' — '+(x.t==='work'?hh(x.p,d):'연차')+(x.o&&x.o.note?' ('+esc(x.o.note)+')':'')).join('<br>')||'근무자가 없습니다.');return}
  let r;
  if(a==='in') r=await sb.from('work_logs').insert({user_id:me.id,work_date:today(),start_time:nowT()});
  else if(a==='out') r=await sb.from('work_logs').update({end_time:nowT(),break_min:+$('#br').value||0}).eq('id',id);
  else if(a==='rq'){const d=$('#ld').value;if(!d)return m('날짜를 선택해 주세요.');r=await sb.from('leave_requests').insert({user_id:me.id,leave_date:d});if(r.error)return m(r.error.code==='23505'?'이미 신청한 날짜입니다.':r.error.message)}
  else if(a==='cx') r=await sb.from('leave_requests').delete().eq('id',id);
  else if(a==='ap'||a==='rj') r=await sb.from('leave_requests').update({status:a==='ap'?'approved':'rejected'}).eq('id',id);
  else if(a==='sv') r=await sb.from('profiles').update({leave_total:+$('#t'+id).value||0}).eq('id',id);
  else if(a==='al'){const d=$('#al').value;if(!d)return m('날짜를 선택해 주세요.');const{data}=await sb.from('profiles').select('id').eq('role','staff');r=await sb.from('leave_requests').upsert((data||[]).map(p=>({user_id:p.id,leave_date:d,kind:'맞춤',status:'approved'})),{onConflict:'user_id,leave_date'})}
  else if(a==='ws') r=await sb.from('profiles').update({work_days:$('#w'+id).value,start_time:$('#s'+id).value||null,end_time:$('#e'+id).value||null}).eq('id',id);
  else if(a==='ov'){const u=$('#ou').value,d=$('#odt').value;if(!u||!d)return m('직원과 날짜를 선택해 주세요.');r=await sb.from('schedule_overrides').upsert({user_id:u,work_date:d,kind:$('#ok').value,note:$('#on').value||null},{onConflict:'user_id,work_date'})}
  else if(a==='od') r=await sb.from('schedule_overrides').delete().eq('id',id);
  else if(a==='ex') return exportCsv();
  else if(a==='ex2') return exportSched();
  else if(a==='su'){const mo=$('#smo').value;if(!mo)return m('귀속월을 선택해 주세요.');const un=slip.pages.filter(p=>!p.uid).length;if(un&&!confirm('미배정 '+un+'쪽은 저장되지 않습니다. 계속할까요?'))return;try{const n=await saveSlips(mo);slipMo=mo;slip=null;alert(n+'명의 급여명세서를 저장했습니다.')}catch(x){return alert('저장 실패: '+x)}}
  else if(a==='op'){const d=await sb.storage.from('payslips').download(id);if(d.error)return alert(d.error.message);const a2=document.createElement('a');a2.href=URL.createObjectURL(d.data);a2.download=id.split('/').pop();a2.click();return}
  else if(a==='ps') r=await sb.from('pay_settings').upsert({user_id:id,pay_type:$('#pt').value,monthly_salary:$('#ms').value===''?null:+$('#ms').value,hourly_rate:$('#hr').value===''?null:+$('#hr').value,weekly_hours:nz($('#mw').value,40),ot_mult:nz($('#mm').value,1.5),sub_work_add:nz($('#ma').value,0.5),sub_off_total:nz($('#mt').value,1.5)});
  else if(a==='kc'){const p1=$('#p1').value;if(p1.length<10||p1!==$('#p2').value)return alert('비밀번호는 10자 이상이어야 하고 두 칸이 같아야 합니다.');try{await makeKeys(p1)}catch(x){return alert('실패: '+x)}}
  else if(a==='ul'){try{await unlock($('#pp').value)}catch(x){return alert('비밀번호가 맞지 않거나 키를 읽지 못했습니다.')}}
  else if(a==='lk'){privKey=null;showAll=false}
  else if(a==='sa'){showAll=!showAll}
  else if(a==='di'){if(!confirm('이 직원의 개인정보를 삭제할까요?'))return;r=await sb.from('sensitive_info').delete().eq('user_id',id)}
  else if(a==='sv2'){
    const ph=$('#ph').value.replace(/\D/g,''),rr=$('#rrn').value.replace(/\D/g,''),ac=$('#ac').value.trim(),bk=$('#bk').value.trim(),nm=$('#nm').value.trim();
    if(!$('#cs').checked)return m('동의에 체크해 주세요.');
    if(rr.length!==13)return m('주민등록번호는 13자리 숫자입니다.');
    if(!/^01\d{8,9}$/.test(ph))return m('휴대전화 번호를 확인해 주세요. 예: 01012345678');
    if(!bk||!nm||!/^[0-9-]{8,20}$/.test(ac))return m('은행, 예금주, 계좌번호(숫자·하이픈 8~20자)를 확인해 주세요.');
    try{const c=await encInfo({r:rr,b:bk,a:ac,n:nm,p:ph});r=await sb.from('sensitive_info').upsert({user_id:me.id,cipher:c,updated_at:new Date().toISOString()})}catch(x){return m(String(x))}
  }
  if(r&&r.error) return alert('실패: '+r.error.message);
  render();
};

async function exportCsv(){
  const mo=$('#mo').value; if(!mo) return;
  const s=mo+'-01',n=new Date(+mo.slice(0,4),+mo.slice(5)-1+1,1),e=iso(n);
  const[P,W,L]=await Promise.all([sb.from('profiles').select('id,name'),sb.from('work_logs').select('*').gte('work_date',s).lt('work_date',e),sb.from('leave_requests').select('*').eq('status','approved').gte('leave_date',s).lt('leave_date',e)]);
  const nm=Object.fromEntries((P.data||[]).map(p=>[p.id,p.name||'이름 없음'])),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=['이름,날짜,근무시간,구분'];
  (W.data||[]).forEach(l=>{const h=hrs(l);if(h>0)rows.push([q(nm[l.user_id]),l.work_date,h.toFixed(2),''].join(','))});
  (L.data||[]).forEach(l=>rows.push([q(nm[l.user_id]),l.leave_date,'',l.kind==='맞춤'?'휴진':'휴가'].join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='근무기록-'+mo+'.csv';a.click();
}
async function exportSched(){
  const mo=$('#mo').value; if(!mo) return;
  const y=+mo.slice(0,4),mn=+mo.slice(5)-1,s=mo+'-01',e=iso(new Date(y,mn+1,1)),nd=new Date(y,mn+1,0).getDate();
  const[P,L,O]=await Promise.all([sb.from('profiles').select('*'),sb.from('leave_requests').select('*').eq('status','approved').gte('leave_date',s).lt('leave_date',e),sb.from('schedule_overrides').select('*').gte('work_date',s).lt('work_date',e)]);
  const lv={},ov={};(L.data||[]).forEach(l=>lv[l.user_id+l.leave_date]=l);(O.data||[]).forEach(o=>ov[o.user_id+o.work_date]=o);
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=['이름,날짜,근무시간,구분,근무요일'];
  (P.data||[]).filter(p=>p.role==='staff').forEach(p=>{
    for(let i=1;i<=nd;i++){
      const d=mo+'-'+String(i).padStart(2,'0'),k=new Date(d+'T00:00:00').getDay(),hr=HRS[k]||HRS[1];
      const net=Math.max(tmn(p.end_time?String(p.end_time):hr[1])-tmn(p.start_time?String(p.start_time):hr[0])-1,0);
      const base=[q(p.name||'이름 없음'),d],tail=q(p.work_days||''),o=ov[p.id+d];
      if(o){if(o.kind==='work')rows.push([...base,net.toFixed(2),'',tail].join(','));continue}
      if(lv[p.id+d]){rows.push([...base,'',lv[p.id+d].kind==='맞춤'?'휴진':'휴가',tail].join(','));continue}
      if(HOL[d]||k===4||!(p.work_days||'').includes(DAY[k]))continue;
      rows.push([...base,net.toFixed(2),'',tail].join(','));
    }
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='근무표기준-'+mo+'.csv';a.click();
}
app.onchange=e=>{const t=e.target;
  if(t.id==='gu')dg.u=t.value;
  else if(t.id==='gk')dg.k=t.value;
  else if(t.id==='gon'){dg.on=t.checked;render()}
  else if(t.id==='pu'){payUser=t.value;render()}
  else if(t.id==='pf'&&t.files[0])parseSlip(t.files[0]);
  else if(t.id==='smo'){slipMo=t.value;render()}
  else if(t.dataset.pg!==undefined){slip.pages[+t.dataset.pg]={uid:t.value||null,inh:false}}};
let dgS=null;
const dgCell=e=>{const x=document.elementFromPoint(e.clientX,e.clientY);return x&&x.closest?x.closest('.cal .c[data-d]'):null};
const dgAdd=c=>{if(c&&dgS&&!dgS.has(c.dataset.d)){dgS.add(c.dataset.d);c.classList.add('sel')}};
app.addEventListener('pointerdown',e=>{
  if(!dg.on||tab!=='cal'||!me||me.role!=='owner')return;
  const c=e.target.closest('.cal .c[data-d]');if(!c)return;
  e.preventDefault();try{c.releasePointerCapture(e.pointerId)}catch(x){}
  dgS=new Set();dgAdd(c);
});
document.addEventListener('pointermove',e=>{if(dgS)dgAdd(dgCell(e))});
document.addEventListener('pointerup',async()=>{
  if(!dgS)return;
  const ds=[...dgS];dgS=null;
  if(!ds.length||!dg.u)return render();
  let r;
  if(dg.k==='reset')r=await sb.from('schedule_overrides').delete().eq('user_id',dg.u).in('work_date',ds);
  else r=await sb.from('schedule_overrides').upsert(ds.map(d=>({user_id:dg.u,work_date:d,kind:dg.k})),{onConflict:'user_id,work_date'});
  if(r.error)alert('실패: '+r.error.message);
  render();
});
sb.auth.onAuthStateChange(()=>{});
render();
</script>
